<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>중학 미술 교실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 레이아웃: 왼쪽에 단원 목차(영역별 색 점), 오른쪽에 한 번에 한 단원. 휴대폰에서는 목차가 위쪽 가로 띠로 바뀜. */
  :root{
    --paper:#FBF9F5; --card:#FFFFFF; --sunk:#F3EFE6; --ink:#20242E; --muted:#6F6A5E; --line:#E3DDD0;
    --navy:#1B2A4A; --on-navy:#FFFFFF; --navy-soft:#C9CFDD;
    --orange:#D8531A; --orange-bg:#FBEFE6; --teal:#00857B; --teal-bg:#E4F6F1; --plum:#7A3E8E; --plum-bg:#F3E9F6;
    --display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
    --body:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141924; --card:#1C2331; --sunk:#232B3B; --ink:#ECE8DF; --muted:#A39E92; --line:#333C4E;
      --navy:#0E1420; --on-navy:#FFFFFF; --navy-soft:#AEB6C8;
      --orange:#FF9057; --orange-bg:#3A2418; --teal:#4FD1C5; --teal-bg:#12332F; --plum:#D29BE3; --plum-bg:#33203A;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141924; --card:#1C2331; --sunk:#232B3B; --ink:#ECE8DF; --muted:#A39E92; --line:#333C4E;
    --navy:#0E1420; --on-navy:#FFFFFF; --navy-soft:#AEB6C8;
    --orange:#FF9057; --orange-bg:#3A2418; --teal:#4FD1C5; --teal-bg:#12332F; --plum:#D29BE3; --plum-bg:#33203A;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--orange);outline-offset:2px;}
  a{color:var(--teal);}

  .shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%;}
  /* ---------- 목차 ---------- */
  .side{background:var(--navy);color:var(--on-navy);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
    position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;}
  .brand{display:block;text-decoration:none;color:var(--on-navy);font-family:var(--display);font-size:26px;line-height:1.15;letter-spacing:.01em;}
  .brand small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--navy-soft);letter-spacing:.08em;margin-top:6px;}
  .side h3{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--navy-soft);margin:22px 0 6px;display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;}
  .a-체험 .dot,.dot.a-체험{background:#F7941D;} .a-표현 .dot,.dot.a-표현{background:#2CC5B6;} .a-감상 .dot,.dot.a-감상{background:#C77DDB;} .a-도구 .dot{background:#C9CFDD;}
  .side nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--on-navy);text-decoration:none;font-size:14.5px;font-weight:500;}
  .side nav a:hover{background:rgba(255,255,255,.09);}
  .side nav a.on{background:#fff;color:#1B2A4A;font-weight:700;}
  .side nav a .done{margin-left:auto;font-size:11px;font-weight:700;color:#2CC5B6;}
  .side nav a.on .done{color:#00857B;}

  /* ---------- 본문 ---------- */
  main{padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;}
  .wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:26px;}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;gap:8px;color:var(--muted);}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,50px);line-height:1.12;margin:6px 0 10px;text-wrap:balance;}
  .lead{font-size:17px;color:var(--muted);max-width:40em;margin:0;}
  h2{font-size:21px;font-weight:700;margin:0 0 4px;text-wrap:balance;}
  section.blk{display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--ink);padding-top:16px;}
  section.blk p{margin:0;max-width:42em;}
  dl.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0;}
  dl.terms div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;}
  dl.terms dt{font-weight:700;font-size:15.5px;}
  dl.terms dd{margin:2px 0 0;font-size:14.5px;color:var(--muted);line-height:1.6;}
  ul.pts{margin:0;padding-left:20px;max-width:42em;} ul.pts li{margin:3px 0;}
  ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;counter-reset:s;}
  ol.steps li{counter-increment:s;background:var(--sunk);border-radius:999px;padding:6px 14px 6px 8px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
  ol.steps li::before{content:counter(s);background:var(--navy);color:var(--on-navy);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;}
  .tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);}
  table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px;}
  th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line);}
  th{background:var(--sunk);font-size:13px;letter-spacing:.04em;white-space:nowrap;}
  tr:last-child td{border-bottom:none;} td:first-child{font-weight:700;white-space:nowrap;}
  .note{border-radius:10px;padding:14px 16px;font-size:15px;}
  .note b.tag{display:block;font-size:12px;letter-spacing:.1em;margin-bottom:2px;}
  .note.idea{background:var(--orange-bg);} .note.idea b.tag{color:var(--orange);}
  .note.check{background:var(--teal-bg);} .note.check b.tag{color:var(--teal);}
  .note ul{margin:4px 0 0;padding-left:20px;}
  .btn{border:none;background:var(--navy);color:var(--on-navy);border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;}
  .btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
  .btn.ok{background:var(--teal-bg);color:var(--teal);border:1.5px solid var(--teal);}
  .foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px;}

  /* ---------- 첫 화면 ---------- */
  .hero{background:var(--navy);color:var(--on-navy);border-radius:18px;padding:30px 26px;position:relative;overflow:hidden;}
  .hero h1{max-width:11em;position:relative;} .hero p{color:var(--navy-soft);max-width:30em;margin:0;position:relative;}
  .hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle,#1B2A4A 36%,transparent 37%),conic-gradient(#ED1C24,#F7941D,#FFF200,#8DC63F,#00A99D,#0072BC,#2E3192,#662D91,#EC008C,#ED1C24);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
  a.unit{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);min-width:0;}
  a.unit:hover{border-color:var(--ink);}
  a.unit b{font-size:16.5px;} a.unit span{font-size:13.5px;color:var(--muted);line-height:1.5;}
  a.unit i{font-style:normal;font-size:12px;font-weight:700;color:var(--teal);}

  /* ---------- 체험 도구 ---------- */
  .lab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .lab h4{margin:0;font-size:16px;} .lab p.sm,.sm{font-size:14px;color:var(--muted);margin:0;}
  .lab canvas{width:100%;height:auto;border-radius:10px;background:var(--sunk);touch-action:none;display:block;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .row label{font-size:14px;font-weight:600;} input[type=range]{accent-color:var(--orange);flex:1 1 160px;min-width:0;}
  .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{border:none;background:transparent;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;}
  .seg button.on{background:var(--navy);color:var(--on-navy);}
  .prin{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .prin figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);}
  .prin svg{width:100%;height:auto;display:block;background:var(--sunk);border-radius:6px;}
  .prin figcaption{font-size:13.5px;margin-top:6px;line-height:1.45;} .prin figcaption b{display:block;font-size:15px;}
  .mixes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .mix{border-radius:10px;height:190px;position:relative;isolation:isolate;overflow:hidden;}
  .mix.add{background:#000;} .mix.sub{background:#fff;border:1px solid var(--line);}
  .mix i{position:absolute;width:104px;height:104px;border-radius:50%;left:50%;top:50%;margin:-52px;}
  .mix.add i{mix-blend-mode:screen;} .mix.sub i{mix-blend-mode:multiply;}
  .mix i:nth-child(1){transform:translate(0,-30px);} .mix i:nth-child(2){transform:translate(-30px,22px);} .mix i:nth-child(3){transform:translate(30px,22px);}
  .tones{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .tones span{flex:1;padding:8px 2px;font-size:12px;font-weight:700;text-align:center;}
  textarea,input[type=text],input[type=search],select{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;}
  textarea{min-height:76px;resize:vertical;line-height:1.6;}
  .field{display:flex;flex-direction:column;gap:4px;} .field label{font-weight:700;font-size:14.5px;} .field small{color:var(--muted);font-size:13.5px;}
  /* 퀴즈 */
  .opts{display:grid;gap:8px;}
  .opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;font-weight:600;cursor:pointer;}
  .opt:hover:not(:disabled){border-color:var(--orange);}
  .opt.right{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);} .opt.wrong{border-color:var(--orange);background:var(--orange-bg);color:var(--orange);}
  .qtext{font-size:18px;font-weight:700;margin:0;line-height:1.5;} .score{font-family:var(--display);font-size:54px;color:var(--orange);line-height:1;}
  .gl a{font-size:12.5px;font-weight:700;text-decoration:none;}

  @media (max-width:820px){
    .shell{display:block;}
    .side{position:sticky;height:auto;z-index:5;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible;}
    .brand{font-size:19px;} .brand small{display:none;}
    .side nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none;}
    .side h3{display:none;} .side nav a{white-space:nowrap;padding:5px 11px;background:rgba(255,255,255,.1);font-size:13.5px;border-radius:999px;}
    .side nav a .done{margin-left:2px;}
    main{padding-block:24px 60px;}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#home">중학 미술 교실<small>미적 체험 · 표현 · 감상</small></a>
    <nav id="nav" aria-label="단원 목차"></nav>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<script>
/* =====================================================================
   단원 내용. 2022 개정 미술과 교육과정의 세 영역(미적 체험·표현·감상)에 맞추어 구성.
   secs 항목: h(소제목) p(설명) terms([용어,풀이]) pts(목록) steps(순서) table({head,rows}) lab(체험 도구 이름)
   ===================================================================== */
const UNITS = [
/* ------------------------------ 미적 체험 ------------------------------ */
{id:"sense", area:"체험", title:"미적 체험과 시각 문화", lead:"미술은 '잘 그리기'보다 '잘 보기'에서 시작해요. 자연과 생활 속에서 아름다움을 느끼고, 우리를 둘러싼 이미지를 읽어 내는 힘을 길러요.",
 secs:[
  {h:"감각으로 만나는 세상", p:"미적 체험은 눈, 귀, 코, 입, 피부로 대상을 느끼고 그 느낌을 자기 말과 이미지로 나타내는 경험이에요. 같은 나무를 보아도 사람마다 다르게 느끼는데, 그 차이가 곧 개성 있는 표현의 출발점이에요.",
   terms:[["미적 체험","자연, 사물, 미술 작품에서 아름다움과 의미를 느끼고 반응하는 경험이에요."],["지각","감각 기관으로 받아들인 정보를 뇌가 알아차리고 해석하는 과정이에요."],["미적 감수성","아름다움을 섬세하게 느끼고 반응하는 능력이에요. 자주 관찰할수록 자라요."],["자연미와 조형미","자연 그대로의 아름다움이 자연미, 사람이 만들어 낸 아름다움이 조형미(인공미)예요."],["공감각","소리를 색으로, 맛을 형태로 느끼듯 한 감각이 다른 감각을 함께 불러오는 현상이에요."]]},
  {h:"시각 문화와 이미지 읽기", p:"광고, 영상, 누리 소통망(SNS), 게임, 간판처럼 눈으로 보고 소통하는 모든 문화를 시각 문화라고 해요. 이미지는 만든 사람의 의도를 담고 있으므로, 그대로 받아들이지 말고 따져 보며 읽어야 해요.",
   terms:[["시각 문화","시각 이미지를 통해 생각과 정보를 주고받는 생활 문화 전체를 말해요."],["시각적 문해력","이미지의 뜻을 읽고, 판단하고, 이미지로 표현하는 능력이에요. '비주얼 리터러시'라고도 해요."],["상징","비둘기가 평화를 뜻하듯, 눈에 보이는 것으로 보이지 않는 뜻을 나타내는 방법이에요."],["기호","약속된 뜻을 전달하는 표시예요. 신호등, 이모티콘, 픽토그램이 모두 기호예요."],["미디어 리터러시","미디어가 전하는 정보를 비판적으로 이해하고 책임 있게 만들어 쓰는 능력이에요."]]},
  {h:"이미지를 읽는 네 가지 질문", steps:["누가, 왜 만들었을까?","무엇이 보이고 무엇이 빠졌을까?","어떤 색·구도·글자로 눈길을 끌까?","나는 어떻게 받아들일까?"]}
 ],
 idea:"등굣길에서 찾은 '아름다운 것 3가지'를 사진으로 찍어 한 줄 설명과 함께 공유해요. 이어서 같은 제품의 광고 두 편을 비교하며 네 가지 질문으로 읽어 보면 시각 문화 수업으로 자연스럽게 이어져요.",
 check:["내 주변에서 자연미와 조형미의 예를 하나씩 들 수 있나요?","광고 이미지에서 만든 사람의 의도를 찾아 설명할 수 있나요?"]},

{id:"life", area:"체험", title:"미술과 삶, 진로, 융합", lead:"미술은 미술관 안에만 있지 않아요. 옷, 집, 도시, 과학과 기술 속에서 미술이 어떤 일을 하는지 살펴보고 나의 진로와도 이어 봐요.",
 secs:[
  {h:"생활 속 미술의 역할", pts:["생각과 감정을 표현하고 다른 사람과 소통하게 해요.","물건과 공간을 쓰기 편하고 아름답게 만들어요.","시대의 모습과 사회 문제를 기록하고 알려요.","서로 다른 문화를 이해하는 창이 되어 줘요."]},
  {h:"다른 분야와 만나는 미술", terms:[["미술과 과학","원근법은 수학, 물감은 화학, 미디어 아트는 공학과 이어져 있어요."],["미술과 음악·문학","칸딘스키는 음악을 색과 형으로 그렸고, 그림책과 웹툰은 글과 그림이 함께 이야기를 만들어요."],["황금비","약 1:1.618의 비율이에요. 예부터 안정되고 아름답게 느껴지는 비례로 알려져 왔어요."],["융합","서로 다른 분야의 지식과 방법을 묶어 새로운 것을 만들어 내는 일이에요."]]},
  {h:"미술과 관련된 직업", table:{head:["분야","직업의 예","하는 일"],rows:[
   ["순수 미술","화가, 조각가, 판화가, 미디어 아티스트","자기 생각을 작품으로 표현해요."],
   ["디자인","시각·제품·패션·UX 디자이너, 건축가","쓰임과 아름다움을 함께 설계해요."],
   ["영상·콘텐츠","웹툰 작가, 애니메이터, 게임 원화가, 영상 감독","이야기를 이미지와 움직임으로 만들어요."],
   ["전시·보존","큐레이터(전시 기획자), 도슨트(전시 해설사), 보존 과학자","작품을 연구하고, 소개하고, 지켜요."],

/* ---------- 공통 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const AREAS = [["체험","미적 체험"],["표현","표현"],["감상","감상"]];
const store = {
  get(k,d){try{const v=localStorage.getItem("artclass:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("artclass:"+k,JSON.stringify(v));}catch(e){}}
};
let done = store.get("done",{});
const css = n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderNav(cur){
  let h="";
  for(const [a,name] of AREAS){
    h+=`<h3 class="a-${a}"><span class="dot"></span>${name}</h3>`;
    for(const u of UNITS.filter(u=>u.area===a))
      h+=`<a href="#${u.id}" class="a-${a}${cur===u.id?" on":""}"><span class="dot"></span>${u.title}${done[u.id]?'<span class="done">완료</span>':""}</a>`;
  }
  h+=`<h3 class="a-도구"><span class="dot"></span>복습 도구</h3>
      <a href="#quiz" class="a-도구${cur==="quiz"?" on":""}"><span class="dot"></span>단원 퀴즈</a>
      <a href="#glossary" class="a-도구${cur==="glossary"?" on":""}"><span class="dot"></span>용어 사전</a>`;
  $("#nav").innerHTML=h;
  const on=$("#nav a.on"); if(on&&matchMedia("(max-width:820px)").matches) on.scrollIntoView({block:"nearest",inline:"center"});
}

/* ---------- 단원 화면 ---------- */
function viewUnit(u){
  const i=UNITS.indexOf(u), prev=UNITS[i-1], next=UNITS[i+1];
  const aname=AREAS.find(a=>a[0]===u.area)[1];
  let h=`<header><div class="eyebrow a-${u.area}"><span class="dot"></span>${aname} 영역 · ${i+1} / ${UNITS.length}</div><h1>${u.title}</h1><p class="lead">${u.lead}</p></header>`;
  for(const s of u.secs){
    h+=`<section class="blk"><h2>${s.h}</h2>`;
    if(s.p) h+=`<p>${s.p}</p>`;
    if(s.terms) h+=`<dl class="terms">`+s.terms.map(t=>`<div><dt>${t[0]}</dt><dd>${t[1]}</dd></div>`).join("")+`</dl>`;
    if(s.pts) h+=`<ul class="pts">`+s.pts.map(x=>`<li>${x}</li>`).join("")+`</ul>`;
    if(s.steps) h+=`<ol class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join("")+`</ol>`;
    if(s.table) h+=`<div class="tscroll"><table><thead><tr>`+s.table.head.map(x=>`<th>${x}</th>`).join("")+`</tr></thead><tbody>`+
      s.table.rows.map(r=>`<tr>`+r.map(c=>`<td>${c}</td>`).join("")+`</tr>`).join("")+`</tbody></table></div>`;
    if(s.lab) h+=LABS[s.lab].html;
    h+=`</section>`;
  }
  h+=`<div class="note idea"><b class="tag">수업 아이디어</b>${u.idea}</div>
      <div class="note check"><b class="tag">스스로 확인하기</b><ul>`+u.check.map(c=>`<li>${c}</li>`).join("")+`</ul></div>
      <div class="foot"><button class="btn ${done[u.id]?"ok":""}" id="doneBtn">${done[u.id]?"배움 완료 표시됨 (누르면 취소)":"이 단원 배움 완료로 표시"}</button>
      <span class="row">${prev?`<a class="btn alt" style="text-decoration:none" href="#${prev.id}">이전: ${prev.title}</a>`:""}${next?`<a class="btn alt" style="text-decoration:none" href="#${next.id}">다음: ${next.title}</a>`:""}</span></div>`;
  return h;
}

 sphere:{html:`<div class="lab"><canvas id="sph" width="640" height="300" aria-label="빛의 방향에 따라 명암이 달라지는 공"></canvas>
   <div class="row"><label for="sphL">빛의 위치</label><input type="range" id="sphL" min="-100" max="100" value="-60"></div>
   <div class="tones" aria-hidden="true"><span style="background:#fff;color:#222">가장 밝은 곳</span><span style="background:#cfcfcf;color:#222">밝은 면</span><span style="background:#8d8d8d;color:#fff">중간 면</span><span style="background:#3a3a3a;color:#fff">어두운 면</span><span style="background:#6a6a6a;color:#fff">반사광</span><span style="background:#1c1c1c;color:#fff">그림자</span></div>
   <p class="sm">빛을 직접 받는 곳이 가장 밝고, 빛 반대편이 가장 어두워요. 어두운 면의 가장자리는 바닥에서 튕겨 온 빛(반사광) 때문에 조금 밝아요. 그림자는 빛의 반대쪽 바닥에 생겨요.</p></div>`,
  init(){
   const c=$("#sph"),x=c.getContext("2d"),sl=$("#sphL");
   const draw=()=>{
     const k=sl.value/100, R=100, cx=320, cy=140;
     x.clearRect(0,0,640,300);
     x.fillStyle=css("--line"); x.fillRect(0,236,640,64);
     x.save(); x.translate(cx-k*120,240); x.scale(1+Math.abs(k)*0.6,0.16);
     const sg=x.createRadialGradient(0,0,10,0,0,R*1.15); sg.addColorStop(0,"rgba(0,0,0,.75)"); sg.addColorStop(1,"rgba(0,0,0,0)");
     x.fillStyle=sg; x.beginPath(); x.arc(0,0,R*1.15,0,7); x.fill(); x.restore();
     const g=x.createRadialGradient(cx+k*55,cy-45,4,cx+k*20,cy-10,R*1.25);
     g.addColorStop(0,"#fff"); g.addColorStop(.18,"#e2e2e2"); g.addColorStop(.48,"#9a9a9a"); g.addColorStop(.78,"#2f2f2f"); g.addColorStop(.92,"#6a6a6a"); g.addColorStop(1,"#5a5a5a");
     x.fillStyle=g; x.beginPath(); x.arc(cx,cy,R,0,7); x.fill();
     x.fillStyle="#F7B500"; x.beginPath(); x.arc(cx+k*260,34,14,0,7); x.fill();
     x.fillStyle=css("--muted"); x.font="600 15px sans-serif"; x.textAlign="center"; x.fillText("빛",cx+k*260,68);
   };
   sl.oninput=draw; draw();
 }},
 persp:{html:`<div class="lab"><div class="row"><div class="seg" id="pMode"><button class="on" data-m="1">1점 투시</button><button data-m="2">2점 투시</button></div><span class="sm">그림 위를 누르거나 끌어서 소실점(눈높이)을 옮겨 보세요.</span></div>
   <canvas id="psp" width="640" height="360" aria-label="투시 원근법 체험 그림"></canvas>
   <p class="sm" id="pTxt"></p></div>`,
  init(){
   const c=$("#psp"),x=c.getContext("2d"); let mode=1, vp={x:320,y:150};
   const L=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
   const ln=(a,b)=>{x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();};
   const cross=(p1,p2,p3,p4)=>{const d=(p1.x-p2.x)*(p3.y-p4.y)-(p1.y-p2.y)*(p3.x-p4.x);const a=p1.x*p2.y-p1.y*p2.x,b=p3.x*p4.y-p3.y*p4.x;return{x:(a*(p3.x-p4.x)-(p1.x-p2.x)*b)/d,y:(a*(p3.y-p4.y)-(p1.y-p2.y)*b)/d};};
   const draw=()=>{
     const ink=css("--ink"),guide=css("--line"),or=css("--orange"),te=css("--teal");
     x.clearRect(0,0,640,360); x.lineWidth=1.5;
     x.strokeStyle=or; x.setLineDash([6,5]); ln({x:0,y:vp.y},{x:640,y:vp.y}); x.setLineDash([]);
     if(mode===1){
       for(const b of [[60,230,110,90],[260,250,120,80],[470,60,110,80],[90,40,90,60]]){
         const f=[{x:b[0],y:b[1]},{x:b[0]+b[2],y:b[1]},{x:b[0]+b[2],y:b[1]+b[3]},{x:b[0],y:b[1]+b[3]}], k=f.map(p=>L(p,vp,.4));
         x.strokeStyle=guide; f.forEach(p=>ln(p,vp));
         x.strokeStyle=ink; x.lineWidth=2.2; for(let i=0;i<4;i++){ln(f[i],f[(i+1)%4]);ln(k[i],k[(i+1)%4]);ln(f[i],k[i]);} x.lineWidth=1.5;
       }
       x.fillStyle=or; x.beginPath(); x.arc(vp.x,vp.y,7,0,7); x.fill();
       $("#pTxt").textContent="정면에서 본 상자예요. 깊이 방향의 선이 모두 하나의 소실점으로 모여요. 눈높이선보다 위에 있는 상자는 아랫면이, 아래에 있는 상자는 윗면이 보여요.";
     }else{
       const v1={x:20,y:vp.y},v2={x:620,y:vp.y};
       for(const b of [[200,200,300,.35],[400,60,130,.3],[330,250,330,.3]]){
         const t={x:b[0],y:b[1]},m={x:b[0],y:b[2]},lt=L(t,v1,b[3]),lb=L(m,v1,b[3]),rt=L(t,v2,b[3]),rb=L(m,v2,b[3]);
         x.strokeStyle=guide; [t,m].forEach(p=>{ln(p,v1);ln(p,v2);});
         x.strokeStyle=ink; x.lineWidth=2.2; ln(t,m);ln(lt,lb);ln(rt,rb);ln(t,lt);ln(m,lb);ln(t,rt);ln(m,rb);
         const top=cross(lt,v2,rt,v1), bot=cross(lb,v2,rb,v1);
         if(b[1]>vp.y){ln(lt,top);ln(rt,top);} if(b[2]<vp.y){ln(lb,bot);ln(rb,bot);} x.lineWidth=1.5;
       }
       x.fillStyle=te; for(const v of [v1,v2]){x.beginPath();x.arc(v.x,v.y,7,0,7);x.fill();}
       $("#pTxt").textContent="모서리를 마주 보고 선 상자예요. 세로선은 그대로 수직이고, 좌우로 물러나는 선이 눈높이선 위의 두 소실점으로 모여요. 위아래로 끌어 눈높이를 바꿔 보세요.";
     }
   };
   const move=e=>{const r=c.getBoundingClientRect();vp.x=Math.max(20,Math.min(620,(e.clientX-r.left)*640/r.width));vp.y=Math.max(20,Math.min(340,(e.clientY-r.top)*360/r.height));draw();};
   let down=false; c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);move(e);}; c.onpointermove=e=>{if(down)move(e);}; c.onpointerup=c.onpointercancel=()=>down=false;
   $("#pMode").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=+b.dataset.m;[...$("#pMode").children].forEach(k=>k.classList.toggle("on",k===b));draw();};
   draw();
 }},
 fps:{html:`<div class="lab"><canvas id="fpsC" width="640" height="200" aria-label="튀는 공 애니메이션"></canvas>
   <div class="row"><button class="btn" id="fpsP">재생</button><label for="fpsS">1초에 <b id="fpsV">12</b>장</label><input type="range" id="fpsS" min="1" max="24" value="12"></div>
   <p class="sm">장수가 적으면 뚝뚝 끊겨 보이고, 많을수록 부드러워요. 영화는 보통 1초에 24장, 손으로 그리는 애니메이션은 12장 안팎을 많이 써요.</p></div>`,
  init(){
   const c=$("#fpsC"),x=c.getContext("2d"),s=$("#fpsS"),b=$("#fpsP"); let on=false,t0=0,raf=0;
   const draw=ts=>{
     if(!c.isConnected){cancelAnimationFrame(raf);return;}
     const fps=+s.value, T=((ts-t0)/1000), f=Math.floor(T*fps)/fps, p=(f%2)/2;
     const X=40+560*(p<.5?p*2:2-p*2), ph=(f*1.6)%1, Y=160-Math.abs(Math.sin(ph*Math.PI))*120;
     x.clearRect(0,0,640,200); x.fillStyle=css("--line"); x.fillRect(0,178,640,22);
     x.fillStyle=css("--orange"); x.beginPath(); x.arc(X,Y,18,0,7); x.fill();
     if(on) raf=requestAnimationFrame(draw);
   };
   s.oninput=()=>{$("#fpsV").textContent=s.value;};
   b.onclick=()=>{on=!on;b.textContent=on?"멈춤":"재생";if(on){t0=performance.now()-0;raf=requestAnimationFrame(draw);}};
   draw(700);
 }},
 critique:{html:`<div class="lab">
   <div class="field"><label for="crT">작품 (작가, 제목)</label><input type="text" id="crT" placeholder="예: 김홍도, 〈씨름〉"></div>
   <div class="field"><label for="cr1">1. 서술</label><small>무엇이 보이나요? 재료와 크기는 어떤가요?</small><textarea id="cr1"></textarea></div>
   <div class="field"><label for="cr2">2. 분석</label><small>색, 구도, 선이 어떻게 쓰였나요? 어디에 눈길이 가나요?</small><textarea id="cr2"></textarea></div>
   <div class="field"><label for="cr3">3. 해석</label><small>작가는 무엇을 말하려 했을까요? 어떤 느낌이 드나요?</small><textarea id="cr3"></textarea></div>
   <div class="field"><label for="cr4">4. 판단</label><small>이 작품의 가치는 무엇인가요? 그렇게 생각한 근거는요?</small><textarea id="cr4"></textarea></div>
   <div class="row"><button class="btn" id="crCopy">글 전체 복사하기</button><button class="btn alt" id="crClear">모두 지우기</button><span class="sm" id="crMsg" role="status"></span></div></div>`,
  init(){
   const ids=["crT","cr1","cr2","cr3","cr4"], names=["작품","1. 서술","2. 분석","3. 해석","4. 판단"], saved=store.get("critique",{});
   ids.forEach(i=>{const e=$("#"+i);e.value=saved[i]||"";e.oninput=()=>{saved[i]=e.value;store.set("critique",saved);};});
   $("#crCopy").onclick=()=>{
     const txt=ids.map((i,n)=>names[n]+"\n"+$("#"+i).value.trim()).join("\n\n");
     const ok=()=>$("#crMsg").textContent="복사했어요. 원하는 곳에 붙여 넣으세요.";
     (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{$("#crMsg").textContent="자동 복사가 막혀 있어요. 칸의 글을 직접 선택해 복사해 주세요.";});
   };
   $("#crClear").onclick=()=>{ids.forEach(i=>{$("#"+i).value="";});store.set("critique",{});$("#crMsg").textContent="모두 지웠어요.";};
 }}
};

/* ---------- 퀴즈 ---------- */
let qz=null;
function viewQuiz(){
  return `<header><div class="eyebrow a-도구">복습 도구</div><h1>단원 퀴즈</h1><p class="lead">범위를 고르면 그 안에서 최대 10문제를 뽑아 드려요. 틀린 문제는 풀이와 함께 해당 단원으로 돌아갈 수 있어요.</p></header>
   <div class="row"><label for="qSel">범위</label><select id="qSel" style="flex:1 1 220px;width:auto"><option value="all">전체 단원</option>`+
   AREAS.map(a=>`<option value="area:${a[0]}">${a[1]} 영역 전체</option>`).join("")+
   UNITS.map(u=>`<option value="${u.id}">${u.title}</option>`).join("")+`</select><button class="btn" id="qStart">새로 시작</button></div>
   <div class="lab" id="qBox"></div>`;
}
function startQuiz(){
  const v=$("#qSel").value;
  let pool=QUIZ.filter(q=>v==="all"||q[0]===v||(v.startsWith("area:")&&UNITS.find(u=>u.id===q[0]).area===v.slice(5)));
  pool=pool.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,10);
  qz={list:pool,i:0,score:0,miss:[]}; drawQ();
}
function drawQ(){
  const box=$("#qBox"); if(!box) return;
  if(qz.i>=qz.list.length){
    const miss=[...new Set(qz.miss)].map(id=>UNITS.find(u=>u.id===id));
    box.innerHTML=`<div class="score">${qz.score} / ${qz.list.length}</div><p class="sm">${qz.score===qz.list.length?"모두 맞혔어요. 훌륭해요!":"틀린 문제가 나온 단원을 다시 살펴보면 금방 채울 수 있어요."}</p>`+
      (miss.length?`<div class="row">`+miss.map(u=>`<a class="btn alt" style="text-decoration:none" href="#${u.id}">${u.title} 다시 보기</a>`).join("")+`</div>`:"")+
      `<div class="row"><button class="btn" id="qAgain">다시 풀기</button></div>`;
    $("#qAgain").onclick=startQuiz; return;
  }
  const q=qz.list[qz.i], u=UNITS.find(u=>u.id===q[0]);
  const order=q[2].map((t,i)=>i).sort(()=>Math.random()-.5);
  box.innerHTML=`<p class="sm"><b>문제 ${qz.i+1} / ${qz.list.length}</b> · ${u.title}</p><p class="qtext">${q[1]}</p>
    <div class="opts">`+order.map(i=>`<button class="opt" data-i="${i}">${esc(q[2][i])}</button>`).join("")+`</div><div id="qFb"></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===q[3];
    box.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i===q[3])o.classList.add("right");});
    if(ok) qz.score++; else {b.classList.add("wrong");qz.miss.push(q[0]);}
    $("#qFb").innerHTML=`<div class="note ${ok?"check":"idea"}"><b class="tag">${ok?"정답이에요":"아쉬워요"}</b>${q[4]}</div><div class="row" style="margin-top:12px"><button class="btn" id="qNext">${qz.i+1<qz.list.length?"다음 문제":"결과 보기"}</button></div>`;
    $("#qNext").onclick=()=>{qz.i++;drawQ();}; $("#qNext").focus();
  });
}

/* ---------- 용어 사전 ---------- */
const GLOSS = UNITS.flatMap(u=>u.secs.flatMap(s=>(s.terms||[]).map(t=>({t:t[0].replace(/^\d\.\s*/,""),d:t[1],u})))).sort((a,b)=>a.t.localeCompare(b.t,"ko"));
function viewGloss(){
  return `<header><div class="eyebrow a-도구">복습 도구</div><h1>용어 사전</h1><p class="lead">모든 단원의 핵심 용어 ${GLOSS.length}개를 가나다순으로 모았어요. 낱말이나 풀이 속 말로 찾을 수 있어요.</p></header>
   <div class="field"><label for="gQ">용어 찾기</label><input type="search" id="gQ" placeholder="예: 보색, 원근, 판화"></div>
   <p class="sm" id="gN" role="status"></p><dl class="terms gl" id="gL"></dl>`;
}
function drawGloss(){
  const q=$("#gQ").value.trim().toLowerCase();
  const r=GLOSS.filter(g=>!q||g.t.toLowerCase().includes(q)||g.d.toLowerCase().includes(q));
  $("#gN").textContent=q?(r.length?`'${q}'에 대한 용어 ${r.length}개를 찾았어요.`:"찾는 용어가 없어요. 다른 낱말로 찾아보세요."):"";
  $("#gL").innerHTML=r.map(g=>`<div><dt>${g.t}</dt><dd>${g.d}</dd><a href="#${g.u.id}">${g.u.title} 단원</a></div>`).join("");
}

/* ---------- 화면 전환 ---------- */
function route(){
  const id=decodeURIComponent(location.hash.slice(1))||"home";
  const u=UNITS.find(u=>u.id===id), v=$("#view");
  if(u){
    v.innerHTML=viewUnit(u);
    u.secs.forEach(s=>{if(s.lab&&LABS[s.lab].init)LABS[s.lab].init();});
    $("#doneBtn").onclick=()=>{done[u.id]=!done[u.id];store.set("done",done);route();};
  }else if(id==="quiz"){v.innerHTML=viewQuiz();$("#qStart").onclick=startQuiz;$("#qSel").onchange=startQuiz;startQuiz();}
  else if(id==="glossary"){v.innerHTML=viewGloss();$("#gQ").oninput=drawGloss;drawGloss();}
  else v.innerHTML=viewHome();
  renderNav(u?u.id:id);
  document.title=(u?u.title+" · ":"")+"중학 미술 교실";
}
let lastHash=null;
function go(){const keep=lastHash===location.hash;lastHash=location.hash;const y=scrollY;route();scrollTo(0,keep?y:0);}
addEventListener("hashchange",go);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",go);
new MutationObserver(go).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
go();
</script>
</body>
